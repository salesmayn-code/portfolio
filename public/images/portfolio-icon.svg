<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Neon Accent Gradient for the 'S' -->
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />

  <!-- Abstract Interconnected 'S' Monogram -->
  <path d="M 68 30 
           C 55 22, 35 25, 33 40 
           C 31 55, 67 48, 65 67 
           C 63 82, 38 80, 28 68" 
        fill="none" 
        stroke="url(#sGrad)" 
        stroke-width="10" 
        stroke-linecap="round" 
        filter="url(#glow)" />

  <!-- Tech Nodes (Endpoints) -->
  <circle cx="68" cy="30" r="4" fill="#38bdf8" />
  <circle cx="28" cy="68" r="4" fill="#818cf8" />
</svg>
